name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
      - if: steps.pages.outcome != 'success'
        run: echo "::warning title=GitHub Pages nicht aktiviert::Unter Settings > Pages muss Source einmalig auf GitHub Actions gesetzt werden. Danach Workflow manuell starten."
      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - if: steps.pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
